# Local development services. Production uses managed Postgres (with pgvector) and Redis.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: acc
      POSTGRES_PASSWORD: acc_dev_password
      POSTGRES_DB: acc_dev
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/database/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
