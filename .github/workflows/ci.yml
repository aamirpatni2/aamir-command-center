# Automated checks on every push and pull request. Uses no real API keys: agents run on the
# built-in mock model and every external integration reports "not configured".
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  checks:
    name: Typecheck, security, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: acc
          POSTGRES_PASSWORD: acc_dev_password
          POSTGRES_DB: acc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U acc" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://acc:acc_dev_password@localhost:5432/acc_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Secret scan and dependency audit
        run: pnpm security
      - name: Unit and integration tests (with coverage)
        run: pnpm test:coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e 'const t=require("./coverage/coverage-summary.json").total; const r=(k)=>`| ${k} | ${t[k].pct}% |`; console.log(["### Coverage","| | |","|---|---|",r("lines"),r("statements"),r("branches"),r("functions")].join("\n"))' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: acc
          POSTGRES_PASSWORD: acc_dev_password
          POSTGRES_DB: acc_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U acc" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      E2E_EMAIL: ci-owner@example.test
      E2E_PASSWORD: ci-owner-password-for-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD= pnpm exec playwright install --with-deps chromium
      - name: Local .env (throwaway secrets, mocks on)
        run: |
          cp .env.example .env
          rand() { node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"; }
          sed -i "s|^SESSION_SECRET=.*|SESSION_SECRET=$(rand)|; s|^ACC_ENCRYPTION_KEY=.*|ACC_ENCRYPTION_KEY=$(rand)|" .env
          sed -i "s|^ACC_ENABLE_MOCKS=.*|ACC_ENABLE_MOCKS=true|; s|^WHATSAPP_APP_SECRET=.*|WHATSAPP_APP_SECRET=dev-local-secret|; s|^WHATSAPP_TRIAGE_DELAY_SECONDS=.*|WHATSAPP_TRIAGE_DELAY_SECONDS=3|" .env
          sed -i "s|^RATE_LIMIT_PER_MINUTE=.*|RATE_LIMIT_PER_MINUTE=5000|; s|^LOGIN_IP_LIMIT=.*|LOGIN_IP_LIMIT=1000|" .env
          mkdir -p data/uploads data/exports
      - name: Migrate and create the owner account
        run: |
          pnpm db:migrate
          OWNER_EMAIL="$E2E_EMAIL" OWNER_NAME="CI Owner" OWNER_PASSWORD="$E2E_PASSWORD" pnpm db:create-owner
      - name: Start API, worker and web
        run: |
          mkdir -p logs
          nohup pnpm dev:api > logs/api.log 2>&1 &
          nohup pnpm dev:worker > logs/worker.log 2>&1 &
          nohup pnpm dev:web > logs/web.log 2>&1 &
          for url in http://localhost:4000/api/health http://localhost:5173/api/health; do
            for i in $(seq 1 60); do curl -sf "$url" >/dev/null && break; sleep 2; done
            curl -sf "$url" >/dev/null || { echo "$url did not come up"; cat logs/*.log; exit 1; }
          done
      - name: Playwright
        run: pnpm e2e
      - name: Server logs
        if: failure()
        run: tail -n 200 logs/*.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: e2e/.results/
          retention-days: 7

  stack:
    name: Production stack (Docker, HTTPS, backups)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_EMAIL: stack-owner@example.test
      E2E_PASSWORD: stack-owner-password-for-ci
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t aamir-command-center:latest .
      - name: Stack settings (localhost; Caddy's internal certificate)
        working-directory: deploy
        run: |
          DOMAIN=localhost ./generate-env.sh
          # Test-only additions: a known webhook secret and higher limits (one account, many parallel tests).
          printf "WHATSAPP_APP_SECRET=dev-local-secret\nWHATSAPP_TRIAGE_DELAY_SECONDS=3\n" >> app.env
          sed -i "s|^RATE_LIMIT_PER_MINUTE=.*|RATE_LIMIT_PER_MINUTE=5000|; s|^LOGIN_IP_LIMIT=.*|LOGIN_IP_LIMIT=1000|" app.env
      - name: Start the stack
        working-directory: deploy
        run: |
          docker compose up -d --no-build --wait --wait-timeout 180 postgres redis api worker caddy backup
          docker compose ps -a
          docker compose logs migrate | tail -3
          curl -skf https://localhost/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = "308"
      - name: The app runs as the least-privilege role
        working-directory: deploy
        run: |
          set -a; . ./.env; set +a
          docker compose exec -T postgres psql -U acc_owner -d acc -tAc "select string_agg(distinct usename, ',') from pg_stat_activity where datname = 'acc' and usename <> 'acc_owner'" | grep -x acc_app
          # Pointed at the owner account, the API must refuse to start.
          (docker compose run --rm --no-deps -e DATABASE_URL="postgres://acc_owner:${POSTGRES_PASSWORD}@postgres:5432/acc" api 2>&1 || true) | grep "Refusing to start"
      - name: Create the owner account
        working-directory: deploy
        run: docker compose run --rm --no-deps -e OWNER_EMAIL="$E2E_EMAIL" -e OWNER_NAME="CI Owner" -e OWNER_PASSWORD="$E2E_PASSWORD" api node --import tsx packages/database/scripts/create-owner.ts
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD= pnpm exec playwright install --with-deps chromium
      - name: Playwright over HTTPS (no model key in production, so @model tests are skipped)
        env:
          E2E_BASE_URL: https://localhost
          E2E_API_URL: https://localhost
          E2E_IGNORE_HTTPS_ERRORS: "1"
          E2E_EXPECT_CSP: "1"
        run: pnpm e2e --grep-invert @model
      - name: Backup and restore
        working-directory: deploy
        run: |
          q() { docker compose exec -T postgres psql -U acc_owner -d acc -tAc "$1"; }
          before=$(q "select count(*) from contacts")
          test "$before" -gt 0
          ./backup-now.sh
          dump="backups/$(cat backups/.last)"
          q "truncate courses, contacts cascade"
          test "$(q 'select count(*) from contacts')" = "0"
          RESTORE_CONFIRM=yes ./restore.sh "$dump"
          test "$(q 'select count(*) from contacts')" = "$before"
          sleep 5
          curl -skf -X POST https://localhost/api/auth/login -H 'content-type: application/json' \
            -d "{\"email\":\"$E2E_EMAIL\",\"password\":\"$E2E_PASSWORD\"}" -o /dev/null
          test "$(q "select has_table_privilege('acc_app', 'audit_logs', 'UPDATE')")" = "f"
      - name: Stack logs
        if: failure()
        working-directory: deploy
        run: docker compose logs --tail 150
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stack-playwright-results
          path: e2e/.results/
          retention-days: 7
